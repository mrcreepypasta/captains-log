<html><body style="background:#0b1620;color:#d8e6ee;font-family:sans-serif;padding:24px"><h1>Wren-576 b</h1><p>A rocky world with a thin ring system, lit by three small moons that cross the rings in slow turns. I scanned it from the observation window and collected a sample. The rings look better than any photo I could send, and I have nobody to point them out to right now.</p><p><a href="../index.html" style="color:#8fd3ff">back</a></p></body></html>
